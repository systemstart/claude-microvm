name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
          diagnostic-endpoint: ''
      - name: Use systemstart Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix build --impure .#claude
      - run: nix build --impure .#gemini
      - run: nix build --impure .#codex
      - run: nix build --impure .#pi
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"

          # 1. Hand-written notes: the body of the annotated tag, written by `make release-tag`.
          #    The sed guard drops a trailing signature block; release tags are signed
          #    (tag.forcesignannotated), and it must not end up in the release body.
          git tag -l --format='%(contents:body)' "$TAG" \
            | sed '/^-----BEGIN \(PGP\|SSH\) SIGNATURE-----/,$d' > notes.md

          # 2. GitHub's own generated notes — merged PRs and new contributors.
          GEN_ARGS=(-f tag_name="$TAG")
          [ -n "$PREV" ] && GEN_ARGS+=(-f previous_tag_name="$PREV")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${GEN_ARGS[@]}" --jq .body >> notes.md

          # 3. Every commit in the range. Step 2 lists only merged PRs, so anything
          #    pushed straight to main — including security fixes — is absent there.
          {
            printf '\n<details><summary>All commits</summary>\n\n'
            git log --no-merges --pretty='* %s (`%h`)' ${PREV:+"$PREV.."}"$TAG"
            printf '\n</details>\n'
          } >> notes.md

          cat notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
