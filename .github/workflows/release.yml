name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - name: Use the nix-gizmos Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-gizmos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          # Upstream microvm.nix CI publishes the QEMU variant our runner needs
          # (see README "Binary caches"); pulling it here avoids a ~20 min
          # source build after a flake.lock bump when the pins line up.
          # microvm-tools and systemstart are this project's earlier caches, read
          # until nix-gizmos has caught up.
          extraPullNames: microvm,microvm-tools,systemstart
      - run: nix build --impure .#claude
      - run: nix build --impure .#gemini
      - run: nix build --impure .#codex
      - run: nix build --impure .#pi
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as an env var, not interpolated into the script: git ref names
          # may contain `;`, `$`, backticks and `|`, so `${{ }}` inside `run:`
          # would let a crafted tag name execute in a job holding a write token.
          TAG: ${{ github.ref_name }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"

          # 1. The changelog: the body of the annotated tag, generated from Conventional
          #    Commit subjects by `make release-tag` (scripts/changelog.sh). It covers
          #    every commit in the range, including anything pushed straight to main.
          #    The sed guard drops a trailing signature block; release tags are signed
          #    (tag.forcesignannotated), and it must not end up in the release body.
          git tag -l --format='%(contents:body)' "$TAG" \
            | sed '/^-----BEGIN \(PGP\|SSH\) SIGNATURE-----/,$d' > notes.md

          # 2. GitHub's own generated notes — merged PRs and new contributors.
          GEN_ARGS=(-f tag_name="$TAG")
          [ -n "$PREV" ] && GEN_ARGS+=(-f previous_tag_name="$PREV")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${GEN_ARGS[@]}" --jq .body >> notes.md

          cat notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
