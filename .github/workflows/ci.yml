name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - name: Use the microvm-tools Cachix cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: microvm-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          # Upstream microvm.nix CI publishes the QEMU variant our runner needs
          # (see README "Binary caches"); pulling it here avoids a ~20 min
          # source build after a flake.lock bump when the pins line up.
          # systemstart is this project's earlier cache, read until
          # microvm-tools has caught up.
          extraPullNames: microvm,systemstart
      - run: nix flake check --impure
      - run: nix build --impure .#claude
      - run: nix build --impure .#gemini
      - run: nix build --impure .#codex
      - run: nix build --impure .#pi

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

